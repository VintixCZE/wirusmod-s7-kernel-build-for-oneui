name: Build WirusMOD NetHunter - Galaxy S7 Flat G930F

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-g930-pie:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out repository and stock XFire reference
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl device-tree-compiler \
            flex git libelf-dev libncurses-dev libssl-dev libxml2-utils \
            lzop make python3 rsync unzip wget xz-utils zip zlib1g-dev

      - name: Download WirusMOD source
        run: |
          git clone --depth 1 --branch aio-mkv8 \
            https://github.com/Svirusx/EOL-Nethunter-s7-kernel-WirusMOD-AiO.git kernel
          test -f kernel/build.sh
          test -d kernel/build/aik
          test -d kernel/build/ramdisk/twPie

      - name: Install compatible AArch64 GCC toolchain
        run: |
          set -euo pipefail
          # The original Linaro releases URL now redirects to an HTML contact page.
          # Use the archived Linaro 6.4.1 AArch64 Linux toolchain mirror instead.
          URL="https://mirror-us-stl1.armbian.airframes.io/dl/_toolchain/gcc-linaro-6.4.1-2017.11-x86_64_aarch64-linux-gnu.tar.xz"
          ARCHIVE="$RUNNER_TEMP/gcc-linaro.tar.xz"
          wget --tries=3 --timeout=60 --https-only "$URL" -O "$ARCHIVE"
          if ! xz -t "$ARCHIVE"; then
            echo "Downloaded toolchain is not a valid XZ archive; refusing to extract it."
            file "$ARCHIVE" || true
            exit 1
          fi
          tar -tJf "$ARCHIVE" >/dev/null
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP"
          TOOLCHAIN_DIR="$RUNNER_TEMP/gcc-linaro-6.4.1-2017.11-x86_64_aarch64-linux-gnu"
          test -x "$TOOLCHAIN_DIR/bin/aarch64-linux-gnu-gcc"
          "$TOOLCHAIN_DIR/bin/aarch64-linux-gnu-gcc" --version | head -n 1
          echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR" >> "$GITHUB_ENV"

      - name: Add WireGuard compatibility source
        run: |
          set -euo pipefail
          cd kernel
          if [ ! -f net/wireguard/Kconfig ]; then
            git clone --depth 1 --branch v1.0.20210606 \
              https://git.zx2c4.com/wireguard-linux-compat "$RUNNER_TEMP/wireguard-linux-compat"
            mkdir -p net/wireguard
            cp -a "$RUNNER_TEMP/wireguard-linux-compat/src/." net/wireguard/
          fi
          test -f net/wireguard/Kconfig
          test -f net/wireguard/Makefile

      - name: Configure G930F Samsung Pie build
        run: |
          set -euo pipefail
          cd kernel
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.sh")
          s = p.read_text()
          old = "export BUILD_CROSS_COMPILE=/home/svirusx/ubertc-6.x/bin/aarch64-linux-android-"
          new = 'export BUILD_CROSS_COMPILE="$TOOLCHAIN_DIR/bin/aarch64-linux-gnu-"'
          if old not in s:
              raise SystemExit("Expected WirusMOD compiler setting was not found; refusing to patch an unexpected build script.")
          s = s.replace(old, new, 1)
          # Keep upstream raw Image packaging; XFire stock boot uses uncompressed ARM64 Image.
          marker = "# PROGRAM START"
          if marker not in s:
              raise SystemExit("Could not find build.sh program entry point.")
          s = s.split(marker, 1)[0]
          s += """
          # CI target: Samsung Pie / Galaxy S7 Flat (SM-G930F)
          OS=twPie
          ANDROID=9
          MTP=sam
          GPU=r29
          MODEL=G930
          OS_DEFCONFIG=$DEFCONFIG_PIE
          DEVICE_DEFCONFIG=$DEFCONFIG_S7FLAT
          PERMISSIVE=yes
          ZIP=yes
          ZIP_NAME=Nethunter_WirusMOD-G930-twPie-r29.zip
          MAIN
          """
          p.write_text(s)
          PY
          chmod +x build.sh
          sudo mkdir -p /home/svirusx
          sudo chown "$(id -u):$(id -g)" /home/svirusx
          ln -sfn "$GITHUB_WORKSPACE/kernel" /home/svirusx/Nethunter-s7-kernel-WirusMOD-AiO

      - name: Compile kernel and flashable ZIP
        shell: bash
        run: |
          set -o pipefail
          cd /home/svirusx/Nethunter-s7-kernel-WirusMOD-AiO
          export TOOLCHAIN_DIR
          bash ./build.sh 2>&1 | tee "$GITHUB_WORKSPACE/wirusmod-build.log"
          ZIP="build/Nethunter_WirusMOD-G930-twPie-r29.zip"
          if [ ! -s "$ZIP" ]; then
            echo "Expected flashable ZIP was not produced."
            find build -maxdepth 3 -type f -printf '%p (%s bytes)\n' || true
            exit 1
          fi
          unzip -t "$ZIP"
          python3 - "$ZIP" "$GITHUB_WORKSPACE/boot.zip" <<'PY'
          import io, struct, sys, tarfile, zipfile
          package, stock_package = sys.argv[1:3]
          def find_boot(blob, depth=0):
              if blob.startswith(b'ANDROID!'): return blob
              if depth >= 3: return None
              try:
                  with zipfile.ZipFile(io.BytesIO(blob)) as z:
                      for item in z.infolist():
                          if not item.is_dir():
                              found = find_boot(z.read(item), depth + 1)
                              if found is not None: return found
              except (zipfile.BadZipFile, OSError): pass
              return None
          with zipfile.ZipFile(package) as z: kernel_archive = z.read('moro/kernel.tar.xz')
          with tarfile.open(fileobj=io.BytesIO(kernel_archive), mode='r:xz') as t:
              boots = [m for m in t.getmembers() if m.isfile() and m.name.endswith('-boot.img')]
              if len(boots) != 1: raise SystemExit('Expected exactly one packaged boot image')
              image = t.extractfile(boots[0]).read()
          with open(stock_package, 'rb') as f: stock_image = find_boot(f.read())
          if stock_image is None: raise SystemExit('Could not find stock XFire boot.img inside boot.zip')
          def parse(data, label):
              if len(data) < 48 or data[:8] != b'ANDROID!': raise SystemExit(label + ': invalid Android boot image')
              vals = struct.unpack_from('<8I', data, 8)
              keys = ('kernel_size','kernel_addr','ramdisk_size','ramdisk_addr','second_size','second_addr','tags_addr','page_size')
              h = dict(zip(keys, vals))
              if h['page_size'] != 2048: raise SystemExit(label + ': unexpected page size')
              if h['kernel_size'] == 0 or 2048 + h['kernel_size'] > len(data): raise SystemExit(label + ': truncated kernel')
              return h
          built, stock = parse(image, 'built'), parse(stock_image, 'stock')
          print('Stock XFire kernel: {:,} bytes; built kernel: {:,} bytes'.format(stock['kernel_size'], built['kernel_size']))
          for key in ('kernel_addr','ramdisk_addr','second_addr','tags_addr','page_size'):
              if built[key] != stock[key]: raise SystemExit('Boot header mismatch for ' + key)
          if image[2048:2050] == bytes((0x1f,0x8b)): raise SystemExit('Built kernel is gzip-compressed; XFire expects raw Image')
          if built['kernel_size'] > stock['kernel_size']:
              delta = built['kernel_size'] - stock['kernel_size']
              raise SystemExit('Built kernel exceeds known-working stock baseline by {:,} bytes; refusing to publish'.format(delta))
          print('PASS: raw Image format, boot addresses, page size, and stock kernel-size baseline verified.')
          PYPY

      - name: Upload validated flashable ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WirusMOD-G930F-Pie-NetHunter
          path: kernel/build/Nethunter_WirusMOD-G930-twPie-r29.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WirusMOD-G930F-build-log
          path: wirusmod-build.log
          if-no-files-found: ignore
          retention-days: 14
