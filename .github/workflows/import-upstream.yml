name: Import WirusMOD upstream source

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type IMPORT to copy the upstream aio-mkv8 source into this repository"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  import-source:
    if: inputs.confirm == 'IMPORT'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream WirusMOD source
        run: |
          git clone --depth 1 --branch aio-mkv8 \
            https://github.com/Svirusx/EOL-Nethunter-s7-kernel-WirusMOD-AiO.git upstream

      - name: Copy source files into this repository
        run: |
          set -euo pipefail
          # Retry once if rsync reports files disappearing during the copy.
          for attempt in 1 2 3; do
            set +e
            rsync -a --delete \
              --exclude='.git/' \
              --exclude='.github/' \
              upstream/ ./
            rsync_status=$?
            set -e

            if [ "$rsync_status" -eq 0 ]; then
              break
            elif [ "$rsync_status" -eq 24 ] && [ "$attempt" -lt 3 ]; then
              echo "Some source files vanished during copy; retrying (attempt $((attempt + 1))/3)."
              continue
            else
              exit "$rsync_status"
            fi
          done
          rm -rf upstream

      - name: Commit imported source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "Import WirusMOD aio-mkv8 upstream source"
          git push
