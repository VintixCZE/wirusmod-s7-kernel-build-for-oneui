name: Import WirusMOD upstream source

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type IMPORT to copy the upstream aio-mkv8 source into this repository"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  import-source:
    if: inputs.confirm == 'IMPORT'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream WirusMOD source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch aio-mkv8 \
            https://github.com/Svirusx/EOL-Nethunter-s7-kernel-WirusMOD-AiO.git /tmp/wirusmod-upstream

      - name: Replace imported source safely
        run: |
          set -euo pipefail
          echo "Import workflow revision: $(git rev-parse HEAD)"
          # Guard against reintroducing the old rsync-based self-copy step.
          if grep -nE '(^|[[:space:]])rsync([[:space:]]|$)' .github/workflows/import-upstream.yml; then
            echo "ERROR: forbidden transfer command found."
            exit 1
          fi
          test -d /tmp/wirusmod-upstream/.git
          # Remove the old imported tree but preserve this repository's Git
          # metadata and workflow definitions.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' ! -name '.github' \
            -exec rm -rf -- {} +
          # Copy from outside the workspace. cp does not scan/delete its own
          # source tree, so it cannot produce rsync's "file has vanished" 24.
          cp -a /tmp/wirusmod-upstream/. .
          rm -rf /tmp/wirusmod-upstream
          test -f build.sh

      - name: Commit imported source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "Import WirusMOD aio-mkv8 upstream source"
          git push
